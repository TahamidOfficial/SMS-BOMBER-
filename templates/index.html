<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYBER TAHAMID</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@700;800;900&family=Inter:wght@600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            /* ব্যাকগ্রাউন্ড সম্পূর্ণ ক্লিন এবং কার্ড সেন্ট্রিক গ্রেডিয়েন্ট */
            background: #090d16;
            min-height: 100vh;
            color: #0f172a;
            font-family: 'Outfit', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
            overflow: hidden;
        }

        /* MAIN GLASS CONTAINER - Optimized for Mobile, PC, Tablet & 4K TVs */
        .glass-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 420px;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(25px) saturate(180%);
            -webkit-backdrop-filter: blur(25px) saturate(180%);
            border: 1.5px solid rgba(255, 255, 255, 1);
            border-radius: 32px;
            padding: 26px 20px 20px 20px;
            box-shadow: 
                inset 0 2px 4px rgba(255, 255, 255, 1),
                inset 0 -2px 3px rgba(0, 0, 0, 0.05),
                0 25px 50px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            gap: 15px;
            animation: containerAppear 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes containerAppear {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        .content-layer {
            position: relative;
            z-index: 3;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* BOLD iOS TITLE */
        .brand-title {
            font-size: 26px;
            font-weight: 900;
            letter-spacing: -0.5px;
            color: #0f172a;
            text-align: center;
            text-transform: uppercase;
        }

        /* CLEAR INPUT FIELD */
        .input-group {
            display: flex;
            align-items: center;
            background: #ffffff;
            border: 1.5px solid #cbd5e1;
            border-radius: 16px;
            padding: 12px 14px;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.03);
            transition: all 0.25s ease;
        }

        .input-group:focus-within {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        .prefix {
            font-size: 15px;
            font-weight: 800;
            color: #0f172a;
            margin-right: 8px;
            display: flex;
            align-items: center;
            gap: 4px;
            white-space: nowrap;
        }

        .number-input {
            border: none;
            background: transparent;
            color: #0f172a;
            font-family: inherit;
            font-size: 16px;
            font-weight: 800;
            outline: none;
            width: 100%;
        }

        .number-input::placeholder {
            color: #94a3b8;
            font-weight: 700;
        }

        /* SELECT DROPDOWN */
        .select-wrapper {
            position: relative;
            width: 100%;
        }

        select {
            width: 100%;
            padding: 13px 30px 13px 14px;
            font-family: inherit;
            font-size: 14px;
            font-weight: 800;
            border-radius: 16px;
            border: 1.5px solid #cbd5e1;
            background: #ffffff;
            color: #0f172a;
            outline: none;
            cursor: pointer;
            transition: all 0.25s ease;
            appearance: none;
            -webkit-appearance: none;
        }

        .select-wrapper::after {
            content: '▼';
            font-size: 10px;
            color: #64748b;
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            pointer-events: none;
        }

        select:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        select option {
            background: #ffffff;
            color: #0f172a;
            font-weight: 700;
            font-size: 13px;
        }

        /* BUTTONS WITH ANIMATION */
        .btn-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        button {
            padding: 14px;
            font-family: inherit;
            font-size: 15px;
            font-weight: 900;
            letter-spacing: 0.5px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.6);
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
            color: #ffffff;
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.12);
        }

        #start-btn { 
            background: linear-gradient(135deg, #10b981 0%, #059669 100%); 
        }
        #start-btn:hover { 
            background: linear-gradient(135deg, #34d399 0%, #10b981 100%);
            transform: translateY(-2px);
        }

        #stop-btn { 
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%); 
        }
        #stop-btn:hover { 
            background: linear-gradient(135deg, #f87171 0%, #ef4444 100%);
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0) scale(0.97);
        }

        /* TERMINAL BOX */
        #status-card {
            background: #ffffff;
            border: 1.5px solid #cbd5e1;
            border-radius: 16px;
            padding: 12px;
            min-height: 80px;
            max-height: 120px;
            text-align: left;
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            font-weight: 800;
            color: #0f172a;
            overflow-y: auto;
            word-break: break-word;
            line-height: 1.5;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.03);
        }

        /* FOOTER */
        .footer-info {
            font-size: 11px;
            color: #475569;
            text-align: center;
            font-weight: 800;
            line-height: 1.4;
        }

        .footer-info span {
            color: #0f172a;
            font-weight: 900;
        }

        /* TV & LARGE SCREEN OPTIMIZATION */
        @media (min-width: 1200px) {
            .glass-container {
                max-width: 460px;
                padding: 30px 24px 22px 24px;
            }
        }
    </style>
</head>
<body>

    <div class="glass-container">
        <div class="content-layer">
            <h2 class="brand-title">CYBER TAHAMID</h2>
            
            <div class="input-group">
                <span class="prefix">🇧🇩 +88</span>
                <input type="text" id="target-number" class="number-input" placeholder="01XXXXXXXXX" maxlength="11">
            </div>

            <div class="select-wrapper">
                <select id="attack-mode">
                    <option value="1">⚡ Fast Mode (20 Cycles)</option>
                    <option value="2">🛡️ Slow Mode (5 Cycles)</option>
                </select>
            </div>

            <div class="btn-row">
                <button id="start-btn" onclick="startAttack()">START</button>
                <button id="stop-btn" onclick="stopAttack()">STOP</button>
            </div>

            <div id="status-card">[System Ready] Enter target number and hit start...</div>

            <div class="footer-info">
                <p>Developed by <span>Tahamid Hossain</span></p>
                <p>Contact: <span>tahamidbusiness1m@gmail.com</span></p>
            </div>
        </div>
    </div>

    <script>
        let activeReader = null;

        async function startAttack() {
            let rawNumber = document.getElementById('target-number').value.trim();
            const mode = document.getElementById('attack-mode').value;
            const statusCard = document.getElementById('status-card');

            if (rawNumber === '01864005433' || rawNumber === '1864005433') {
                alert("এই নাম্বারে মেসেজ পাঠানো যাবে না!");
                return;
            }

            let number = "";
            if (rawNumber.startsWith('0') && rawNumber.length === 11) {
                number = rawNumber;
            } else if (rawNumber.length === 10) {
                number = '0' + rawNumber;
            }

            if (number.length !== 11 || !number.startsWith('01')) {
                alert("দয়া করে সঠিক ১১ ডিজিটের নাম্বার দিন (যেমন: 01XXXXXXXXX)।");
                return;
            }

            statusCard.innerHTML = `[+] Initializing attack on +88${number}...\n`;

            try {
                const response = await fetch(`/run-sms?number=${number}&mode=${mode}`);
                const reader = response.body.getReader();
                activeReader = reader;
                const decoder = new TextDecoder();

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    const text = decoder.decode(value, { stream: true });
                    
                    if (text.includes("FILTERED")) {
                        alert("এই নাম্বারে মেসেজ পাঠানো যাবে না!");
                        statusCard.innerHTML = "[!] Blocked by system filter.";
                        break;
                    } else if (text.includes("INVALID")) {
                        statusCard.innerHTML = "[!] Invalid Number format.";
                        break;
                    } else if (text.includes("DONE")) {
                        statusCard.innerHTML += "<br>[✓] Process successfully finished.";
                        break;
                    } else {
                        statusCard.innerHTML += text.replace(/\n/g, '<br>');
                        statusCard.scrollTop = statusCard.scrollHeight;
                    }
                }
            } catch (err) {
                statusCard.innerHTML += "<br>[!] Connection terminated.";
            }
        }

        async function stopAttack() {
            if (activeReader) {
                try { activeReader.cancel(); } catch (e) {}
            }
            
            fetch('/stop-sms', { method: 'POST' })
                .then(res => res.json())
                .then(data => {
                    document.getElementById('status-card').innerHTML += `<br>[🛑] ${data.message}`;
                });
        }
    </script>
</body>
</html>
